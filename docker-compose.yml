services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: AI_chat
    volumes:
      - .:/var/www
    depends_on:
      - db
      - mailhog

  nginx:
    image: nginx:alpine
    container_name: AI_nginx
    ports:
      - "8003:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:8.0
    command: --log-bin-trust-function-creators=1
    container_name: ai_chat
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ai_chat
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel123
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    volumes:
      - D:/laravel_projects/AI-Productivity-hub/database/db-dumps:/dumps

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ai_phpmyadmin
    ports:
      - "8083:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root

  mailhog:
    image: mailhog/mailhog
    container_name: ai_mailhog
    ports:
      - "1027:1025"
      - "8027:8025"

volumes:
  dbdata:
